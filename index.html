<html lang="en">

    <meta name="description" content="Altera Terra — a private Mediterranean house, guest retreat and workshop in Urla. Coming soon." />
    <title>Altera Terra — Coming Soon</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23264149'/%3E%3Cpath d='M15 43 32 15l17 28h-7l-4-7H26l-4 7h-7Zm15-13h5l-3-6-2 6Z' fill='%23f0ece7'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; --petrol:#264149; --ivory:#f0ece7; --copper:#b66c3c; }
      * { box-sizing:border-box; }
      html, body { margin:0; min-height:100%; background:#16272a; color:var(--ivory); font-family: Georgia, 'Times New Roman', serif; }
      body { overflow-x:hidden; }
      .page { min-height:330svh; position:relative; isolation:isolate; background:#16272a; }
      .scene { position:fixed; inset:0; overflow:hidden; z-index:-1; background:#425b5d; }
      .scene::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(14,26,28,.18), rgba(10,18,20,.48) 72%, #16272a 100%); z-index:2; }
      .scene::after { content:''; position:absolute; inset:0; background:rgba(10,24,33,calc(var(--night, 0) * .56)); mix-blend-mode:multiply; z-index:3; }
      .hero-image { position:absolute; width:100%; height:100%; object-fit:cover; object-position:center 54%; filter:saturate(calc(.86 - var(--night, 0) * .2)) contrast(calc(1.04 + var(--night, 0) * .1)) brightness(calc(1.03 - var(--night, 0) * .35)); transform:scale(1.04); will-change:transform,filter; }
      .grain { position:absolute; inset:0; z-index:4; opacity:.08; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"); mix-blend-mode:soft-light; }
      header { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:30px clamp(24px,5vw,74px); z-index:5; text-transform:uppercase; letter-spacing:.22em; font: 11px/1.2 Arial, sans-serif; }
      .mark { display:flex; align-items:center; gap:12px; letter-spacing:.3em; }
      .mark-symbol { width:25px; height:25px; border:1px solid rgba(240,236,231,.7); display:grid; place-items:center; transform:rotate(45deg); }
      .mark-symbol::after { content:''; width:7px; height:7px; border:1px solid var(--copper); }
      .mark span { transform:translateY(1px); }
      .phase { display:flex; gap:10px; align-items:center; color:rgba(240,236,231,.75); }
      .phase i { width:6px; height:6px; border-radius:50%; background:var(--copper); box-shadow:0 0 14px var(--copper); }
      main { min-height:330svh; display:flex; align-items:flex-end; padding:0 clamp(24px,7vw,110px) clamp(58px,9vh,100px); position:relative; z-index:5; pointer-events:none; }
      .content { max-width:700px; position:sticky; bottom:12vh; opacity:var(--copy, 0); transform:translateY(calc((1 - var(--copy, 0)) * 28px)); transition:opacity .12s linear, transform .12s linear; }
      .eyebrow { margin:0 0 20px; text-transform:uppercase; letter-spacing:.27em; font:11px/1.3 Arial,sans-serif; color:#f3b27b; }
      h1 { margin:0; font-size:clamp(64px,11vw,170px); font-weight:400; line-height:.79; letter-spacing:-.065em; text-shadow:0 5px 36px rgba(0,0,0,.22); }
      h1 em { font-style:italic; }
      .intro { max-width:445px; margin:30px 0 0; font-size:clamp(17px,2vw,22px); line-height:1.4; color:rgba(240,236,231,.88); }
      .footer-line { margin-top:42px; display:flex; align-items:center; gap:18px; font:10px/1.2 Arial,sans-serif; text-transform:uppercase; letter-spacing:.22em; color:rgba(240,236,231,.72); }
      .footer-line::before { content:''; width:55px; height:1px; background:var(--copper); }
      .scroll { position:absolute; right:clamp(24px,5vw,74px); bottom:54px; z-index:5; writing-mode:vertical-rl; text-transform:uppercase; letter-spacing:.24em; font:10px Arial,sans-serif; color:rgba(240,236,231,.64); display:flex; gap:14px; align-items:center; }
      .scroll::after { content:''; width:1px; height:54px; background:rgba(240,236,231,.45); }
      .control { display:none; }
      .caption { position:absolute; left:clamp(24px,5vw,74px); bottom:28px; z-index:5; font:10px Arial,sans-serif; letter-spacing:.18em; text-transform:uppercase; color:rgba(240,236,231,.54); }
      @media (max-width:650px) { header { padding-top:22px; } .phase { display:none; } main { padding-bottom:74px; } .intro { margin-top:24px; } .scroll { display:none; } .control { top:77px; } .caption { bottom:24px; } }
      @media (prefers-reduced-motion:reduce) { .hero-image { animation:none; } .scene::after { transition:none; } }
    </style>
  </head>

          <p class="eyebrow">A house, a table, a workshop</p>
          <h1>Coming<br><em>soon.</em></h1>
          <p class="intro">A private Mediterranean place for living slowly, making carefully and gathering around a good fire.</p>
          <div class="footer-line">Altera Terra · Urla</div>
        </div>
      </main>
      <div class="scroll">Enter the landscape</div>
      <div class="caption" id="caption">Dusk study · 01 / 01</div>
    </div>
    <script>
      const page = document.querySelector('.page');
      const scene = document.getElementById('scene');
      const image = document.querySelector('.hero-image');
      const label = document.getElementById('phaseLabel');
      const caption = document.getElementById('caption');
      const content = document.querySelector('.content');
      let ticking = false;
      function render() {
        const range = Math.max(1, page.offsetHeight - window.innerHeight);
        const progress = Math.min(1, Math.max(0, window.scrollY / range));
        const night = Math.min(1, Math.max(0, (progress - .42) / .48));
        const scale = 1.04 + progress * .34;
        const x = progress * -1.3;
        const y = progress * -2.2;
        const copy = Math.min(1, Math.max(0, (progress - .68) / .16));
        scene.style.setProperty('--night', night.toFixed(3));
        page.style.setProperty('--copy', copy.toFixed(3));
        image.style.transform = `scale(${scale.toFixed(3)}) translate3d(${x.toFixed(2)}%, ${y.toFixed(2)}%, 0)`;
        label.textContent = progress > .73 ? 'Urla · After dark' : progress > .35 ? 'Urla · Blue hour' : 'Urla · Golden hour';
        caption.textContent = progress > .73 ? 'After dark · 01 / 01' : progress > .35 ? 'Blue hour · 01 / 01' : 'Golden hour · 01 / 01';
        ticking = false;
      }
      function onScroll() { if (!ticking) { window.requestAnimationFrame(render); ticking = true; } }
      window.addEventListener('scroll', onScroll, { passive:true });
      window.addEventListener('resize', render);
      render();
    </script>
  </body>
</html>
